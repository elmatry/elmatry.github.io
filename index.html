<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المطري - فخامة 60 سنة</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:#0f0f0f; color:#fff; overflow-x:hidden; }
  .container { max-width:1100px; margin:auto; padding:15px; }
  header { text-align:center; padding:30px 10px 10px; }
  header h1 { font-size:42px; color:#d4af37; }
  header h1 span { color:#fff; font-size:20px; display:block; margin-top:5px; letter-spacing:3px; }
  header p { color:#aaa; margin-top:10px; font-size:16px; }
  .hero { background:#1a1a1a; border:1px solid #d4af37; border-radius:20px; padding:25px 15px; text-align:center; margin-top:20px; }
  .hero h2 { font-size:30px; margin-bottom:10px; }
  .hero p { color:#ccc; line-height:1.7; font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:25px; }
  .card { background:#1c1c1c; border-radius:15px; padding:20px 10px; text-align:center; border:1px solid #333; }
  .card h3 { color:#d4af37; margin-bottom:8px; font-size:18px; }
  .card p { color:#bbb; font-size:14px; line-height:1.6; }
  footer { text-align:center; padding:25px 10px; color:#777; font-size:14px; }
  @media (max-width:768px){
    header h1 { font-size:32px; }
    .hero h2 { font-size:22px; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>المطري<span>EL MATRY</span></h1>
      <p>فخامة 60 سنة</p>
    </header>
    <div class="hero">
      <h2>فخامة تدوم 60 سنة</h2>
      <p>المطري .. اسم ليه تاريخ، وذوق ليه هيبة. جودة تستاهل اسمك، وشياكة تليق بيك في كل مناسبة.</p>
    </div>
    <div class="grid">
      <div class="card"><h3>جودة أصلية</h3><p>خامات نضيفة تعيش معاك سنين</p></div>
      <div class="card"><h3>شياكة</h3><p>موديلات فخمة على ذوقك</p></div>
      <div class="card"><h3>تاريخ كبير</h3><p>60 سنة خبرة في السوق</p></div>
    </div>
    <footer>© 2026 المطري - EL MATRY | كل الحقوق محفوظة</footer>
  </div>
</body>
</html>
